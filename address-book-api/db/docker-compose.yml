services:
  db:
    image: postgres:18-alpine
    container_name: address-book-api-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: address-book
    ports:
      - "5432:5432"
    volumes:
      # Local bind mount inside your project directory
      - ./db_data:/var/lib/postgresql/data
